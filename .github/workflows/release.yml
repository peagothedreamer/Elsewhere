name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Stamp version
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("src/updater.py")
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          source = path.read_text(encoding="utf-8")
          path.write_text(re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{version}"', source), encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Test
        run: python tests/test_core.py

      - name: Build (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean packaging/Elsewhere.spec

      - name: Make portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path dist/Elsewhere -DestinationPath "dist/Elsewhere-$ver-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          iscc "/DMyAppVersion=$ver" packaging/installer/Elsewhere.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Elsewhere-Setup-*.exe
            dist/Elsewhere-*-portable.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Stamp version
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("src/updater.py")
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          source = path.read_text(encoding="utf-8")
          path.write_text(re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{version}"', source), encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Test
        run: python tests/test_core.py

      - name: Build (PyInstaller)
        env:
          ELSEWHERE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0' }}
        run: python -m PyInstaller --noconfirm --clean packaging/Elsewhere.spec

      - name: Make DMG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist/dmg
          ditto "dist/Elsewhere.app" "dist/dmg/Elsewhere.app"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/dmg/
          cp -R LICENSES dist/dmg/LICENSES
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Elsewhere" -srcfolder dist/dmg -ov -format UDZO \
            "dist/Elsewhere-$ver-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Elsewhere-*-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum Elsewhere-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            -R "${{ github.repository }}" \
            --title "Elsewhere ${{ github.ref_name }}" \
            --generate-notes
