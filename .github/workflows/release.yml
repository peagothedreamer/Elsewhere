name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Test
        run: python tests/test_core.py

      - name: Build (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean packaging/Elsewhere.spec

      - name: Make portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path dist/Elsewhere -DestinationPath "dist/Elsewhere-$ver-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          iscc "/DMyAppVersion=$ver" packaging/installer/Elsewhere.iss

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Name -match '^(Elsewhere-Setup-.*\.exe|Elsewhere-.*-portable\.zip)$' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            "dist/Elsewhere-Setup-$ver.exe" `
            "dist/Elsewhere-$ver-portable.zip" `
            "dist/SHA256SUMS.txt" `
            --title "Elsewhere $ver" `
            --generate-notes
